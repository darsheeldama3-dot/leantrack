<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeanTrack</title>
<style>
body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}header{background:#111827;color:#fff;padding:18px}main{max-width:850px;margin:auto;padding:14px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:16px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}.metric{background:#eef2f6;padding:12px;border-radius:12px}.metric b{display:block;font-size:21px}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #ccd2d8}input{width:100%;box-sizing:border-box;margin:4px 0 9px}button{background:#111827;color:#fff;border:0;margin:3px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.bar{height:9px;background:#111827;border-radius:8px;width:0}.track{height:9px;background:#e5e7eb;border-radius:8px}.food{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.muted{color:#667085}
</style></head><body>
<header><h1>LeanTrack</h1><small>Protein • calories • water • steps • training</small></header><main>
<section class="card"><h2>Today</h2><div class="grid">
<div class="metric">Protein<b id="p">0 g</b><small>Goal <span id="pg">120</span> g</small></div>
<div class="metric">Calories<b id="cal">0</b><small>Goal <span id="cg">2500</span></small></div>
<div class="metric">Water<b id="water">0 L</b><small>Goal <span id="wg">3</span> L</small></div>
<div class="metric">Steps<b id="steps">0</b><small>Goal <span id="sg">8000</span></small></div></div>
<p>Protein</p><div class="track"><div id="pb" class="bar"></div></div><p>Calories</p><div class="track"><div id="cb" class="bar"></div></div></section>
<section class="card"><h2>Add food</h2><div class="row">
<label>Food<input id="name" placeholder="Paneer"></label><label>Amount<input id="amt" placeholder="200 g"></label>
<label>Calories<input id="k" type="number"></label><label>Protein (g)<input id="pr" type="number" step=".1"></label>
<label>Carbs (g)<input id="cr" type="number" step=".1"></label><label>Fat (g)<input id="ft" type="number" step=".1"></label>
<label>Fiber (g)<input id="fi" type="number" step=".1"></label><div></div>
<button class="wide" onclick="addFood()">Add food</button></div></section>
<section class="card"><h2>Quick add</h2>
<button onclick="add('Plant protein','36 g',130,30,3,2,2)">OZiva: 1 scoop</button>
<button onclick="add('Milk','300 ml',183,10,14,10,0)">Milk 300 ml</button>
<button onclick="add('Creatine','5 g',0,0,0,0,0)">Creatine 5 g</button>
<button onclick="waterAdd(.5)">+500 ml water</button><button onclick="stepAdd(1000)">+1,000 steps</button></section>
<section class="card"><h2>Foods today</h2><div id="list"></div></section>
<section class="card"><h2>Goals</h2><div class="row">
<label>Protein<input id="gp" type="number" value="120"></label><label>Calories<input id="gk" type="number" value="2500"></label>
<label>Water (L)<input id="gw" type="number" step=".1" value="3"></label><label>Steps<input id="gs" type="number" value="8000"></label>
<button class="wide" onclick="saveGoals()">Save goals</button></div></section>
<section class="card"><h2>Body & workout</h2><div class="row">
<label>Weight kg<input id="wt" type="number" step=".1"></label><label>Workout<input id="wo" placeholder="Leg day"></label>
<label>Minutes<input id="wm" type="number"></label><label>Creatine<select id="ct"><option>No</option><option>Yes</option></select></label>
<button class="wide" onclick="saveBody()">Save check-in</button></div><p id="status" class="muted"></p></section>
<section class="card"><button onclick="exportData()">Export backup</button><button onclick="resetDay()">Reset today</button><p class="muted">Data stays in this browser using local storage.</p></section>
</main>
<script>
const KEY='leantrack';let d=JSON.parse(localStorage.getItem(KEY)||'null')||{g:{p:120,k:2500,w:3,s:8000},days:{}};
const day=()=>{let x=new Date().toISOString().slice(0,10);d.days[x]??={foods:[],w:0,s:0};return d.days[x]};const save=()=>{localStorage.setItem(KEY,JSON.stringify(d));render()};
function add(n,a,k,p,c,f,i){day().foods.push({n,a,k:+k,p:+p,c:+c,f:+f,i:+i});save()}
function addFood(){add(name.value,amt.value,k.value||0,pr.value||0,cr.value||0,ft.value||0,fi.value||0);['name','amt','k','pr','cr','ft','fi'].forEach(x=>document.getElementById(x).value='')}
function waterAdd(x){day().w+=x;save()}function stepAdd(x){day().s+=x;save()}
function saveGoals(){d.g={p:+gp.value||120,k:+gk.value||2500,w:+gw.value||3,s:+gs.value||8000};save()}
function saveBody(){let x=day();x.wt=+wt.value||null;x.wo=wo.value;x.wm=+wm.value||0;x.ct=ct.value==='Yes';save()}
function resetDay(){if(confirm('Reset today?')){delete d.days[new Date().toISOString().slice(0,10)];save()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='leantrack-backup.json';a.click()}
function render(){let x=day(),g=d.g,s=x.foods.reduce((a,z)=>{a.k+=z.k;a.p+=z.p;a.c+=z.c;a.f+=z.f;a.i+=z.i;return a},{k:0,p:0,c:0,f:0,i:0});p.textContent=s.p.toFixed(1)+' g';cal.textContent=Math.round(s.k);water.textContent=x.w.toFixed(1)+' L';steps.textContent=x.s.toLocaleString();pg.textContent=g.p;cg.textContent=g.k;wg.textContent=g.w;sg.textContent=g.s;pb.style.width=Math.min(100,s.p/g.p*100)+'%';cb.style.width=Math.min(100,s.k/g.k*100)+'%';gp.value=g.p;gk.value=g.k;gw.value=g.w;gs.value=g.s;wt.value=x.wt||'';wo.value=x.wo||'';wm.value=x.wm||0;ct.value=x.ct?'Yes':'No';status.textContent=x.wt?`Weight ${x.wt} kg • ${x.wo||'No workout'} • Creatine ${x.ct?'taken':'not logged'}`:'';list.innerHTML=x.foods.length?x.foods.map((z,i)=>`<div class="food"><div><b>${z.n}</b><br><span class="muted">${z.a} • ${z.k} kcal • ${z.p} g protein • C ${z.c} • F ${z.f} • fiber ${z.i}</span></div><button onclick="day().foods.splice(${i},1);save()">×</button></div>`).join(''):'<p class="muted">Nothing logged yet.</p>'}
render();
</script></body></html>
